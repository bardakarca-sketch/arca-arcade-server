<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bir Ömür</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe7d8; --paper:#fbf7ef; --paper2:#f4ecdc; --ink:#2b2833; --mute:#7c7468; --line:#e3d8c4;
  --accent:#e2583e; --accent2:#c9432b; --red:#e04f4f; --yellow:#e9a93a; --blue:#3b6fd8; --purple:#9a5bd6; --green:#2f9e6e;
  --gold:#fff1c7; --shadow:0 6px 18px rgba(60,40,10,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16151b; --paper:#211f27; --paper2:#2a2731; --ink:#ece6da; --mute:#9d95a6; --line:#35313d;
    --gold:#3d3420; --shadow:0 6px 18px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16151b; --paper:#211f27; --paper2:#2a2731; --ink:#ece6da; --mute:#9d95a6; --line:#35313d;
  --gold:#3d3420; --shadow:0 6px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* header */
.head{padding:14px 16px 10px;background:var(--paper);border-bottom:2px dashed var(--line);box-shadow:var(--shadow);z-index:2}
.who{display:flex;align-items:center;gap:12px}
.ava{width:56px;height:56px;border-radius:18px;background:var(--paper2);display:grid;place-items:center;font-size:34px;flex:none}
.who .nm{font-family:Caveat,cursive;font-size:30px;line-height:1;font-weight:700}
.who .st{color:var(--mute);font-size:13px;font-weight:600;margin-top:3px}
.agebox{margin-left:auto;text-align:center}
.agebox b{display:block;font-size:30px;font-weight:900;line-height:1}
.agebox span{font-size:11px;color:var(--mute);font-weight:800;letter-spacing:.08em}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.stat{font-size:12px;font-weight:800}
.stat .lb{display:flex;justify-content:space-between;margin-bottom:3px}
.bar{height:8px;border-radius:9px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.stat.low .bar i{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.money{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}
.money small{color:var(--mute);font-weight:700;font-size:12px}

/* journal */
.journal{flex:1;overflow-y:auto;padding:14px 16px 20px;
  background:repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px)}
.year{font-family:Caveat,cursive;font-size:24px;font-weight:700;color:var(--accent);margin:8px 0 2px}
.entry{background:var(--paper);border-left:4px solid var(--line);border-radius:6px 12px 12px 6px;padding:8px 11px;margin:6px 0;font-size:14.5px;line-height:1.4;box-shadow:0 1px 0 var(--line);animation:slide .3s ease}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
.entry.good{border-left-color:var(--green)}
.entry.bad{border-left-color:var(--red)}
.entry.gold{border-left-color:var(--yellow);background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--paper2)}
.chip.p{color:var(--green)} .chip.m{color:var(--red)}

/* footer */
.foot{background:var(--paper);border-top:2px dashed var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;align-items:end;gap:4px;z-index:2}
.tab{min-height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mute);transition:transform .15s,background .15s}
.tab span{font-size:22px}
.tab:active{transform:scale(.92);background:var(--paper2)}
.ageBtn{width:84px;height:84px;margin:-30px auto 0;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 6px 0 var(--accent2),0 10px 22px rgba(226,88,62,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:13px;transition:transform .12s,box-shadow .12s}
.ageBtn b{font-size:26px;line-height:1}
.ageBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--accent2),0 4px 10px rgba(226,88,62,.3)}
.ageBtn:disabled{filter:grayscale(1);opacity:.5}
.energy{grid-column:1/-1;text-align:center;font-size:12px;font-weight:800;color:var(--mute);margin-bottom:2px}
.energy i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--yellow);margin:0 2px;vertical-align:-2px;transition:.25s}
.energy i.off{background:var(--line);transform:scale(.75)}

/* sheet + modal */
.veil{position:fixed;inset:0;background:rgba(20,15,10,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:10}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);max-height:78vh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.9,.25,1);z-index:11}
.sheet.on{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sh-t{display:flex;align-items:center;gap:8px;font-family:Caveat,cursive;font-size:30px;font-weight:700;margin-bottom:6px}
.sh-t .x{margin-left:auto;font-family:Nunito;font-size:13px;font-weight:800;color:var(--mute);min-height:44px;padding:0 10px}
.sh-e{font-size:12.5px;color:var(--mute);font-weight:700;margin:-4px 0 8px}
.row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:9px 12px;margin:6px 0;border-radius:14px;background:var(--paper2);transition:transform .15s,background .15s}
.row:active{transform:scale(.97)}
.row .ic{font-size:24px;width:32px;text-align:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px}
.row .tx small{display:block;color:var(--mute);font-size:12px;font-weight:700}
.row .go{color:var(--mute);font-weight:900}
.row.dis{opacity:.45}
.empty{text-align:center;color:var(--mute);padding:24px 8px;font-weight:700}
.empty span{display:block;font-size:40px;margin-bottom:6px}
.sec{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--mute);margin:14px 2px 2px}

.modal{position:fixed;left:50%;top:50%;width:min(440px,calc(100% - 32px));transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;background:var(--paper);border-radius:22px;padding:20px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:.22s cubic-bezier(.2,.9,.25,1);z-index:13;max-height:86vh;overflow-y:auto}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal .me{font-size:48px;text-align:center}
.modal h2{font-family:Caveat,cursive;font-size:32px;margin:2px 0 6px;text-align:center}
.modal p{font-size:15.5px;line-height:1.5;margin:0 0 12px;text-align:center}
.modal .chips{justify-content:center;margin:-4px 0 12px}
.btn{display:block;width:100%;min-height:50px;border-radius:14px;background:var(--paper2);font-weight:800;font-size:15px;margin:7px 0;padding:10px 14px;transition:transform .12s,background .15s;text-align:center}
.btn small{display:block;font-size:11.5px;color:var(--mute);font-weight:700}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent2)}
.btn.pri small{color:#ffe1d8}
.btn:disabled{opacity:.45}
.mveil{z-index:12}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);width:min(440px,calc(100% - 32px));background:var(--ink);color:var(--paper);padding:11px 14px;border-radius:14px;font-weight:700;font-size:14px;z-index:20;transition:transform .25s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow)}
.toast.on{transform:translate(-50%,0)}
.toast .chip{background:rgba(255,255,255,.14)}
.toast .chip.p{color:#7ee0b0}.toast .chip.m{color:#ff9a8f}

/* screens */
.screen{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.screen.hide{display:none}
.card{width:min(440px,100%);background:var(--paper);border-radius:24px;padding:24px 20px;box-shadow:var(--shadow);text-align:center}
.logo{font-family:Caveat,cursive;font-size:64px;font-weight:700;line-height:.9;color:var(--accent)}
.tag{color:var(--mute);font-weight:700;margin:6px 0 18px}
.inp{display:flex;gap:8px;margin-bottom:10px}
.inp input{flex:1;min-width:0;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--paper2);color:var(--ink);font:inherit;font-weight:800;font-size:16px;padding:0 14px;outline:none}
.inp input:focus{border-color:var(--accent)}
.inp button{width:50px;border-radius:14px;background:var(--paper2);font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{min-height:48px;border-radius:14px;background:var(--paper2);font-weight:800;border:2px solid transparent;transition:.15s}
.seg button.on{border-color:var(--accent);color:var(--accent)}
.best{margin-top:14px;font-size:13px;color:var(--mute);font-weight:800}
.tomb{font-size:60px}
.epi{font-family:Caveat,cursive;font-size:28px;line-height:1.1;margin:6px 0 4px}
.score{font-size:46px;font-weight:900;color:var(--accent);line-height:1}
.miles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.miles span{background:var(--paper2);border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:800}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sum div{background:var(--paper2);border-radius:12px;padding:8px 4px;font-size:11px;font-weight:800;color:var(--mute)}
.sum b{display:block;font-size:16px;color:var(--ink)}
.theme{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:12px;background:var(--paper2);font-size:18px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <div class="who">
      <div class="ava" id="ava">👶</div>
      <div><div class="nm" id="nm">—</div><div class="st" id="st">—</div></div>
      <div class="agebox"><b id="age">0</b><span>YAŞ</span></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="money"><span>💰 <span id="para">₺0</span></span><small id="net"></small></div>
  </header>
  <main class="journal" id="journal"></main>
  <footer class="foot">
    <div class="energy" id="energy"></div>
    <button class="tab" data-tab="ben"><span>🙂</span>Ben</button>
    <button class="tab" data-tab="iliski"><span>💞</span>İlişkiler</button>
    <button class="ageBtn" id="ageBtn"><b>+1</b>YAŞ</button>
    <button class="tab" data-tab="kariyer"><span>🎒</span>Kariyer</button>
    <button class="tab" data-tab="para"><span>🪙</span>Para</button>
  </footer>
</div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="veil mveil" id="mveil"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<section class="screen" id="start">
  <div class="card">
    <button class="theme" id="themeBtn" aria-label="Tema">🌓</button>
    <div class="logo">Bir Ömür</div>
    <div class="tag">Her yıl bir sayfa. Hikâyeni sen yaz.</div>
    <div class="inp"><input id="nameIn" maxlength="14" placeholder="Adın"><button id="dice" aria-label="Rastgele isim">🎲</button></div>
    <div class="seg"><button data-g="k">👧 Kız</button><button data-g="e" class="on">👦 Erkek</button></div>
    <button class="btn pri" id="goBtn">Hayata başla</button>
    <button class="btn" id="contBtn" style="display:none">Kaldığın yerden devam et</button>
    <div class="best" id="bestTxt"></div>
    <p style="font-size:12.5px;color:var(--mute);margin:14px 0 0;line-height:1.5">Her yıl <b>3 enerji</b> hakkın var: spor, aşk, kariyer, yatırım... Harca, sonra <b>+1 YAŞ</b>'a bas.<br>Klavye: Boşluk = yaş al · 1-4 = sekmeler</p>
  </div>
</section>

<section class="screen hide" id="end"><div class="card" id="endCard"></div></section>

<script>
/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function money(n){const s=n<0?'-':'';n=Math.abs(n);
  if(n>=1e6)return s+'₺'+(n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+' Mn';
  if(n>=1e3)return s+'₺'+Math.round(n/1e3)+' bin';return s+'₺'+Math.round(n)}

const MN=['Emir','Kerem','Arda','Mert','Can','Yusuf','Ege','Baran','Efe','Kaan','Alp','Onur','Burak','Selim'];
const FN=['Elif','Zeynep','Defne','Ela','Asya','Nehir','Ada','Duru','Ece','Lina','Melis','Ayşe','Selin','Derin'];
const SUR=['Yılmaz','Kaya','Demir','Şahin','Çelik','Aydın','Arslan','Doğan','Kılıç','Öztürk','Korkmaz','Aksoy'];
const CITIES=['İstanbul','İzmir','Ankara','Trabzon','Eskişehir','Antalya','Mardin','Bursa','Çanakkale','Kayseri'];
const STATS={saglik:['❤️','Sağlık','var(--red)'],mutluluk:['😊','Mutluluk','var(--yellow)'],zeka:['🧠','Zeka','var(--blue)'],karizma:['✨','Karizma','var(--purple)']};
const FIELDS={
  bilgisayar:{n:'Bilgisayar Müh.',min:65,y:4},tip:{n:'Tıp',min:80,y:6},hukuk:{n:'Hukuk',min:68,y:4},
  mimarlik:{n:'Mimarlık',min:60,y:4},egitim:{n:'Öğretmenlik',min:45,y:4},isletme:{n:'İşletme',min:40,y:4},guzel:{n:'Güzel Sanatlar',min:35,y:4}};
const JOBS=[
  {id:'garson',n:'Garson',e:'🍽️',sal:170000,min:16},
  {id:'kurye',n:'Kurye',e:'🛵',sal:200000,min:16},
  {id:'muzisyen',n:'Sokak Müzisyeni',e:'🎸',sal:110000,min:16,kar:40},
  {id:'satis',n:'Satış Danışmanı',e:'🛍️',sal:260000,min:18,lise:1,kar:35},
  {id:'asistan',n:'Ofis Asistanı',e:'🗂️',sal:300000,min:18,lise:1,zeka:40},
  {id:'fenomen',n:'Sosyal Medya Fenomeni',e:'📱',sal:450000,min:18,kar:75},
  {id:'yazilim',n:'Yazılımcı',e:'💻',sal:850000,deg:'bilgisayar'},
  {id:'doktor',n:'Doktor',e:'🩺',sal:1200000,deg:'tip'},
  {id:'avukat',n:'Avukat',e:'⚖️',sal:780000,deg:'hukuk'},
  {id:'mimar',n:'Mimar',e:'📐',sal:650000,deg:'mimarlik'},
  {id:'ogretmen',n:'Öğretmen',e:'🍎',sal:420000,deg:'egitim'},
  {id:'pazarlama',n:'Pazarlama Uzmanı',e:'📈',sal:520000,deg:'isletme'},
  {id:'illustrator',n:'İllüstratör',e:'🎨',sal:320000,deg:'guzel'},
];
const LEVELS=['','Kıdemli ','Baş ','Efsane '];
const MILES={
  ilkis:['💼','İlk maaş'],mezun:['🎓','Diploma'],evlilik:['💍','Evet dedin'],ebeveyn:['🍼','Ebeveyn'],
  milyoner:['💰','Milyoner'],kedi:['🐱','Bir kedinin insanı'],maraton:['🏅','Maratoncu'],dunya:['🌍','Dünya gezgini'],
  tavan:['🏆','Zirvede'],asirlik:['🎂','Asırlık'],piyango:['🍀','Şans meleği'],ev:['🏡','Ev sahibi'],yazar:['📖','Yazar']};

let S=null, modalOpen=false, sheetOpen=false, curTab=null, gender='e';

/* ---------- ses ---------- */
let AC=null;
function tone(f,d,type='sine',v=.12,t0=0,f2){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function sfx(k){
  if(k==='click')tone(880,.04,'triangle',.06);
  else if(k==='tick'){tone(520,.08,'sine',.1);tone(780,.1,'sine',.08,.07)}
  else if(k==='good'){tone(523,.1,'triangle');tone(784,.16,'triangle',.12,.08)}
  else if(k==='bad'){tone(260,.25,'sawtooth',.08,0,140)}
  else if(k==='gold'){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.11,i*.08))}
  else if(k==='end'){[392,330,262,196].forEach((f,i)=>tone(f,.4,'sine',.1,i*.22))}
}

/* ---------- partikül ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],looping=false,last=0;
function fitCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',fitCv);fitCv();
function burst(n=40,colors=['#e2583e','#e9a93a','#2f9e6e','#3b6fd8','#9a5bd6']){
  const x=innerWidth/2,y=innerHeight*.35;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=150+Math.random()*350;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,r:3+Math.random()*4,c:pick(colors),l:1,rot:Math.random()*6})}
  if(!looping){looping=true;last=performance.now();requestAnimationFrame(loop)}}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99;p.l-=dt*.8;p.rot+=dt*8;
    cx.save();cx.globalAlpha=Math.max(0,p.l);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}
  if(parts.length)requestAnimationFrame(loop);else{looping=false;cx.clearRect(0,0,innerWidth,innerHeight)}}
function shake(){const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}

/* ---------- çekirdek ---------- */
function apply(d){const out=[];if(!d)return out;
  for(const k in d){let v=Math.round(d[k]);if(!v)continue;
    if(k==='para')S.para+=v;
    else if(k==='perf'){if(S.job)S.job.perf=clamp(S.job.perf+v);continue}
    else if(k==='grade'){S.grade=clamp(S.grade+v);continue}
    else{const b=S[k];S[k]=clamp(b+v);v=S[k]-b;if(!v)continue}
    out.push([k,v])}
  return out}
function chipHTML(chips){if(!chips||!chips.length)return'';
  return '<div class="chips">'+chips.map(([k,v])=>{const sg=v>0?'+':'';
    const label=k==='para'?sg+money(v).replace('-₺','-₺')+' 💰':sg+v+' '+STATS[k][0];
    return `<span class="chip ${v>0?'p':'m'}">${label}</span>`}).join('')+'</div>'}

function addMile(id){if(S.miles.includes(id))return;S.miles.push(id);const[e,n]=MILES[id];

function famPick(rel){return S.fam.find(f=>f.rel===rel&&f.alive)}
function avatar(){const a=S.age,k=S.g==='k';if(!S.alive)return'🪦';if(a<3)return'👶';if(a<13)return k?'👧':'👦';if(a<20)return k?'👩‍🦰':'🧑';if(a<60)return k?'👩':'👨';return k?'👵':'👴'}
function status(){
  if(!S.alive)return'Huzur içinde';

  if(S.job)s=jobTitle();else if(S.uni)s=FIELDS[S.uni.f].n+' öğrencisi';else if(S.retired)s='Emekli';
  else if(a<3)s='Bebek';else if(a<6)s='Okul öncesi';else if(S.edu==='ilkokul')s='İlkokul öğrencisi';else if(S.edu==='lise')s='Lise öğrencisi';
  else s='İşsiz';
  return s+' · '+S.city}
function jobTitle(){const j=JOBS.find(x=>x.id===S.job.id);return LEVELS[S.job.lvl]+j.n}
function jobSal(){return Math.round(S.job.sal*Math.pow(1.3,S.job.lvl))}

function newLife(name,g){
  const wealth=pick(['dar','orta','orta','varlikli']);
  S={name,sur:pick(SUR),g,city:pick(CITIES),wealth,age:0,energy:3,
    saglik:R(72,95),mutluluk:R(60,85),zeka:R(25,75),karizma:R(25,75),
    para:0,net:0,edu:'yok',grade:60,uni:null,degree:null,job:null,retired:false,pension:0,
    partner:null,married:false,kids:[],fam:[],miles:[],used:[],log:[],hapSum:0,alive:true,
    house:false,car:false,pet:null,lastEv:null};
  S.fam.push({rel:'Annen',name:pick(FN),age:R(21,38),love:R(65,95),alive:true});
  S.fam.push({rel:'Baban',name:pick(MN),age:R(23,42),love:R(55,90),alive:true});
  if(chance(.5))S.fam.push({rel:'Kardeşin',name:pick(chance(.5)?FN:MN),age:R(1,7),love:R(40,80),alive:true});

  log(`${S.city}'da, ${wt} bir ailenin ${g==='k'?'kızı':'oğlu'} olarak dünyaya geldin. Adın: <b>${name} ${S.sur}</b>.`,'good');
  const sib=famPick('Kardeşin');if(sib)log(`Seni kıskançlıkla izleyen bir abla/abin var: ${sib.name}.`);

function ageUp(){
  if(!S||!S.alive||modalOpen)return;
  closeSheet();
  S.age++;S.energy=3;const a=S.age;sfx('tick');
  // doğal değişimler
  if(a<18)apply({saglik:R(0,2)});
  if(a>40)apply({saglik:-R(0,2)});if(a>60)apply({saglik:-R(0,3)});if(a>80)apply({saglik:-R(1,3)});
  S.mutluluk=clamp(S.mutluluk+Math.sign(55-S.mutluluk)*R(0,2));
  if(a>55)S.karizma=clamp(S.karizma-R(0,1));
  schoolTick(a);familyTick();loveTick();jobTick();moneyTick(a);
  if(S.para>=1e6)addMile('milyoner');if(a>=100)addMile('asirlik');
  S.hapSum+=S.mutluluk;
  if(checkDeath()){render();return}
  render(true);save();
  const sc=scripted(a);
  if(sc)setTimeout(()=>showEvent(sc),250);
  else if(chance(a<3?.5:.72)){const ev=pickEvent();if(ev)setTimeout(()=>showEvent(ev),250)}
}
function schoolTick(a){
  if(S.edu==='ilkokul'||S.edu==='lise')S.grade=clamp(S.grade+(S.zeka-50)/25+R(-5,5));
  if(a===6){S.edu='ilkokul';log('🎒 İlkokula başladın. Önlüğün biraz büyük ama olsun.')}
  if(a===14){S.edu='lise';log('🏫 Liseye başladın. Koridorlar kocaman görünüyor.')}
  if(a===18&&S.edu==='lise'){S.edu='lisemezun';log(S.grade>70?'🎓 Liseyi parlak notlarla bitirdin!':'🎓 Liseyi bitirdin. Bitti ya, önemli olan o.','good')}
  if(S.uni){S.uni.left--;if(S.uni.left<=0){S.degree=S.uni.f;S.edu='unimezun';log(`🎓 ${FIELDS[S.uni.f].n} bölümünden mezun oldun!`,'good',apply({mutluluk:10,zeka:4}));S.uni=null;addMile('mezun')}}
}
function familyTick(){
  for(const f of S.fam){if(!f.alive)continue;f.age++;if(S.age>16)f.love=clamp(f.love-R(0,3));
    if(f.age>62&&chance((f.age-62)*.012+.004)){f.alive=false;
      log(`🕊️ ${f.rel.replace(/n$/,'')} ${f.name}, ${f.age} yaşında hayata gözlerini yumdu.`,'bad',apply({mutluluk:-14}));
      if(S.wealth==='varlikli'&&f.rel!=='Kardeşin'&&S.age>=18){const m=R(400000,1800000);log(`Sana ${money(m)} miras kaldı.`,'n',apply({para:m}))}}}
  for(const k of S.kids){k.age++;if(k.age===18)log(`🧳 Çocuğun ${k.name} üniversite için evden ayrıldı. Ev bir anda sessizleşti.`)}
}
function loveTick(){
  const p=S.partner;if(!p)return;
  p.love=clamp(p.love-R(1,5));if(S.married)apply({mutluluk:2});
  if(p.love<15){
    if(S.married){const loss=Math.max(0,Math.round(S.para*.3));log(`💔 ${p.name} ile boşandınız. Avukatlar bile üzüldü.`,'bad',apply({mutluluk:-15,para:-loss}))}
    else log(`💔 ${p.name} ile yollarınız ayrıldı.`,'bad',apply({mutluluk:-10}));
    S.partner=null;S.married=false}
}
function jobTick(){
  if(!S.job)return;S.job.yrs++;S.job.perf=clamp(S.job.perf+R(-7,3));
  if(S.job.perf<12&&chance(.5)){log(`📦 Performansın düşük diye ${jobTitle()} işinden kovuldun.`,'bad',apply({mutluluk:-12}));S.job=null}
}
function moneyTick(a){
  if(a<18){S.net=0;return}
  if(a===18){const m={dar:5000,orta:40000,varlikli:300000}[S.wealth];log(`Ailen hayata atılman için sana ${money(m)} verdi.`,'good',apply({para:m}))}
  let inc=0,exp=0;
  if(S.job)inc=jobSal();else if(S.retired)inc=S.pension;
  if(S.uni)exp=S.wealth==='dar'?15000:40000;else if(a<22&&!S.job)exp=30000;else exp=S.house?60000:160000;
  exp+=S.kids.filter(k=>k.age<18).length*60000+(S.car?25000:0);
  S.net=inc-exp;S.para+=S.net;
  if(S.para<0&&S.uni&&S.uni.left>0){log('🎓 Masraflarını öğrenim kredisi karşılıyor. Mezun olunca ödeyeceksin.')}
  else if(S.para<0){S.para=Math.round(S.para*1.12);log(`💸 Borçtasın (${money(S.para)}). Faiz de büyüyor...`,'bad',apply({mutluluk:-5,saglik:-1}))}
  if(!S.job&&!S.uni&&!S.retired&&a>=22&&a<60)apply({mutluluk:-2});
}
function checkDeath(){
  let c=null;
  if(S.saglik<=0)c=S.age>65?'yaşlılığa bağlı sağlık sorunları':'ağır bir hastalık';
  else if(S.age>=70&&chance((S.age-70)*.018+Math.max(0,50-S.saglik)/300))c='huzur içinde, uykusunda';
  else if(S.age>=16&&chance(.0012))c='talihsiz bir kaza';
  else if(S.age>=118)c='inanılmaz bir yaşta, tarihe geçerek';
  if(!c)return false;
  S.alive=false;S.cause=c;log(`🕯️ ${S.age} yaşında ${c} nedeniyle aramızdan ayrıldın.`,'bad');
  save();sfx('end');setTimeout(showEnd,900);return true}

function pickEvent(){
  const el=EVENTS.filter(e=>S.age>=e.min&&S.age<=e.max&&!(e.once&&S.used.includes(e.id))&&e.id!==S.lastEv&&(!e.c||e.c()));
  if(!el.length)return null;let tot=el.reduce((s,e)=>s+(e.w||1),0),x=Math.random()*tot;
  for(const e of el){x-=(e.w||1);if(x<=0)return e}return el[0]}
function showEvent(ev){
  if(ev.id){S.lastEv=ev.id;if(ev.once)S.used.push(ev.id)}
  showModal({e:ev.e,t:ev.t,x:typeof ev.x==='function'?ev.x():ev.x,ch:ev.ch})}

/* ---------- modal ---------- */
function showModal(o){
  modalOpen=true;const m=$('#modal');
  m.innerHTML=`<div class="me">${o.e}</div><h2>${o.t}</h2><p>${o.x}</p>`+
    o.ch.map((c,i)=>`<button class="btn ${i===0&&o.ch.length===1?'pri':''}" data-i="${i}" ${c.dis?'disabled':''}>${c.t}${c.sub?`<small>${c.sub}</small>`:''}</button>`).join('');
  m.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{const c=o.ch[+b.dataset.i];const res=c.run();
    if(res==='keep')return;if(res)outcome(res,true);else closeModal()});
  m.classList.add('on');$('#mveil').classList.add('on')}
function closeModal(){modalOpen=false;$('#modal').classList.remove('on');$('#mveil').classList.remove('on');render();save()}
function outcome(res,inModal){
  const chips=apply(res.d);const t=res.o||toneOf(chips);
  log(res.m,t,chips);feedback(t);
  if(res.mile)addMile(res.mile);
  if(S.para>=1e6)addMile('milyoner');
  if(inModal){const m=$('#modal');
    m.innerHTML=`<div class="me">${t==='good'?'✨':t==='bad'?'😬':'📝'}</div><p>${res.m}</p>${chipHTML(chips)}<button class="btn pri">Devam</button>`;
    m.querySelector('.btn').onclick=closeModal}
  else toast(res.m+chipHTML(chips));
  render();
  if(S.saglik<=0&&S.alive){checkDeath();closeModal();closeSheet()}
}

    const x=Math.random();if(x<.45)return r('Girişim battı. Ders alındı.',{para:-Math.round(b*R(60,100)/100),mutluluk:-4},'bad');
    if(x<.88)return r('Girişim tuttu! Güzel kazanç.',{para:Math.round(b*R(20,120)/100),mutluluk:3},'good');
    return r('JACKPOT! Yatırdığın şirket bir yıldız oldu!',{para:b*R(3,6),mutluluk:10},'gold')})));
  L.push(A('🎟️','Piyango bileti','₺200',act(()=>{const x=Math.random();
    if(x<.0008)return r('İNANILMAZ! BÜYÜK İKRAMİYE SENİN!',{para:10000000,mutluluk:30},'gold','piyango');
    if(x<.03)return r('Amorti değil, gerçek ikramiye! Küçük ama tatlı.',{para:R(1000,20000),mutluluk:3},'good');
    return r('Boş çıktı. Hayal kurması güzeldi.',{para:-200})},200)));
  if(base>=20000)L.push(A('💝','Bağış yap','Paranın %5\'i · iyi hissettirir',act(()=>r('Bir okulun kütüphanesine bağış yaptın.',{para:-Math.round(base*.05),mutluluk:R(5,9),karizma:R(2,4)},'good'))));
  L.push({sec:'MÜLK'});
  if(!S.house)L.push(A('🏡','Ev satın al','₺3,5 Mn · kira biter',act(()=>{S.house=true;return r('Anahtarları teslim aldın. Kendi evin!',{para:-3500000,mutluluk:15},'good','ev')},3500000)));
  else L.push(A('🏡','Evin','Kira yok, huzur çok',()=>{},{info:1}));
  if(!S.car)L.push(A('🚗','Araba al','₺900 bin · +Karizma',act(()=>{S.car=true;return r('Yeni araban kapının önünde parlıyor.',{para:-900000,mutluluk:8,karizma:4},'good')},900000)));
  else L.push(A('🚗','Araban','Yıllık bakım ₺25 bin',()=>{},{info:1}));
  return L}

/* ---------- sheet ---------- */
let sheetTitle='',sheetFn=null;
const TABS={ben:['🙂 Kendin',benList],iliski:['💞 İlişkiler',iliskiList],kariyer:['🎒 Kariyer',kariyerList],para:['🪙 Para',paraList]};
function openTab(k){curTab=k;openSheet(TABS[k][0],TABS[k][1])}
function openSheet(t,fn){if(!S||!S.alive||modalOpen)return;sheetTitle=t;sheetFn=fn;sheetOpen=true;renderSheet();$('#sheet').classList.add('on');$('#veil').classList.add('on');sfx('click')}
function closeSheet(){sheetOpen=false;$('#sheet').classList.remove('on');$('#veil').classList.remove('on')}
function renderSheet(){
  if(!sheetOpen)return;if(!S.alive){closeSheet();return}
  const items=sheetFn();const sh=$('#sheet');
  sh.innerHTML=`<div class="grab"></div><div class="sh-t">${sheetTitle}<button class="x" id="shx">Kapat ✕</button></div>
    <div class="sh-e">⚡ Kalan enerji: ${S.energy}/3 · 💰 ${money(S.para)}</div>`+
    items.map((it,i)=>it.sec?`<div class="sec">${it.sec}</div>`:it.empty?`<div class="empty"><span>${it.empty}</span>${it.txt}</div>`:
      `<button class="row ${it.dis?'dis':''}" data-i="${i}"><span class="ic">${it.ic}</span><span class="tx"><b>${it.t}</b>${it.sub?`<small>${it.sub}</small>`:''}</span>${it.info?'':`<span class="go">${it.go?'›':'⚡'}</span>`}</button>`).join('');
  sh.querySelectorAll('.row').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];it.run()});
  $('#shx').onclick=closeSheet}

/* ---------- render ---------- */
function render(bump){
  if(!S)return;
  $('#ava').textContent=avatar();$('#nm').textContent=S.name+' '+S.sur;$('#st').textContent=status();
  const ag=$('#age');ag.textContent=S.age;if(bump){ag.classList.remove('pop');void ag.offsetWidth;ag.classList.add('pop')}
  $('#stats').innerHTML=Object.entries(STATS).map(([k,[e,n,c]])=>`<div class="stat ${S[k]<25?'low':''}"><div class="lb"><span>${e} ${n}</span><span>${Math.round(S[k])}</span></div><div class="bar"><i style="width:${S[k]}%;background:${c}"></i></div></div>`).join('');
  $('#para').textContent=money(S.para);$('#para').style.color=S.para<0?'var(--red)':'';
  $('#net').textContent=S.age>=18?`${S.net>=0?'+':''}${money(S.net)}/yıl`:'';
  $('#energy').innerHTML='⚡ '+[0,1,2].map(i=>`<i class="${i<S.energy?'':'off'}"></i>`).join('');
  $('#ageBtn').disabled=!S.alive;
  // günlük
  let h='',cur=null;
  for(let i=S.log.length-1;i>=0;i--){const l=S.log[i];if(l.a!==cur){cur=l.a;h+=`<div class="year">${l.a===0?'Doğum':l.a+' yaşında'}</div>`}
    h+=`<div class="entry ${l.o}">${l.t}${chipHTML(l.c)}</div>`}
  const j=$('#journal');j.innerHTML=h;j.scrollTop=0;
  if(sheetOpen)renderSheet()}

/* ---------- son ---------- */
function score(){const avg=S.hapSum/Math.max(1,S.age);
  return Math.round(S.age*4+avg*3+S.miles.length*40+Math.max(0,Math.log10(Math.max(1,S.para)))*15+(S.married?30:0)+S.kids.length*20)}
function epitaph(){
  if(S.kids.length>=3)return'Kalabalık bir sofranın başıydı.';
  if(S.para>=5e6)return'Parayı buldu; umarız huzuru da buldu.';
  if(S.zeka>=85)return'Çok okudu, çok bildi, hep merak etti.';
  if(S.karizma>=85)return'Girdiği her odayı aydınlattı.';
  if(S.mutluluk>=80)return'Gülerek yaşadı, gülerek hatırlanacak.';
  if(S.age>=95)return'Sabırla, uzun uzun yaşadı.';
  if(S.age<30)return'Kısa ama dolu dolu bir hikâye.';
  return'Kendi hikâyesini kendi yazdı.'}
function showEnd(){
  closeSheet();if(modalOpen){modalOpen=false;$('#modal').classList.remove('on');$('#mveil').classList.remove('on')}
  const sc=score(),best=+(store.get('birOmur.best')||0),rec=sc>best;if(rec)store.set('birOmur.best',sc);
  $('#endCard').innerHTML=`<div class="tomb">🪦</div><div class="epi">${S.name} ${S.sur}</div>
    <div style="color:var(--mute);font-weight:700">${S.age} yıl · ${S.cause}</div>
    <p style="font-style:italic;margin:10px 0">“${epitaph()}”</p>
    <div class="sum"><div><b>${Math.round(S.hapSum/Math.max(1,S.age))}</b>ort. mutluluk</div><div><b>${money(S.para)}</b>servet</div><div><b>${S.kids.length}</b>çocuk</div></div>
    <div class="miles">${S.miles.length?S.miles.map(m=>`<span>${MILES[m][0]} ${MILES[m][1]}</span>`).join(''):'<span>Kilometre taşı yok</span>'}</div>
    <div style="font-size:12px;font-weight:900;color:var(--mute);letter-spacing:.1em">ÖMÜR PUANI</div>
    <div class="score">${sc}</div>
    <div class="best">${rec?'🎉 YENİ REKOR!':'Rekor: '+best}</div>
    <button class="btn pri" id="againBtn" style="margin-top:14px">Yeni bir hayat</button>
    <button class="btn" id="journalBtn">Günlüğe bak</button>`;
  $('#end').classList.remove('hide');if(rec)burst(80);
  $('#againBtn').onclick=()=>{$('#end').classList.add('hide');showStart()};
  $('#journalBtn').onclick=()=>$('#end').classList.add('hide');
  $('#ageBtn').disabled=true}
function showStart(){
  $('#start').classList.remove('hide');
  const best=store.get('birOmur.best');$('#bestTxt').textContent=best?`🏆 Rekor ömür puanı: ${best}`:'';
  $('#contBtn').style.display=store.get('birOmur.save')?'block':'none';
  $('#nameIn').value=''}

/* ---------- olay bağlama ---------- */
$('#ageBtn').onclick=ageUp;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));
$('#veil').onclick=closeSheet;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{gender=b.dataset.g;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));sfx('click')});
$('#dice').onclick=()=>{$('#nameIn').value=pick(gender==='k'?FN:MN);sfx('click')};
$('#goBtn').onclick=()=>{const n=$('#nameIn').value.trim()||pick(gender==='k'?FN:MN);newLife(n.charAt(0).toLocaleUpperCase('tr')+n.slice(1),gender);sfx('good')};
$('#contBtn').onclick=()=>{try{S=JSON.parse(store.get('birOmur.save'));$('#start').classList.add('hide');render();sfx('good')}catch(e){store.del('birOmur.save');showStart()}};
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#goBtn').click()});
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';store.set('birOmur.theme',r.dataset.theme)};
{const t=store.get('birOmur.theme');if(t)document.documentElement.dataset.theme=t}
addEventListener('keydown',e=>{
  if(!$('#start').classList.contains('hide')||!$('#end').classList.contains('hide'))return;
  if(modalOpen){const n=+e.key;if(n>=1&&n<=9){const b=$('#modal').querySelectorAll('.btn')[n-1];if(b&&!b.disabled)b.click()}
    else if(e.key==='Enter'||e.key===' '){const b=$('#modal').querySelector('.btn.pri');if(b){e.preventDefault();b.click()}}return}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();ageUp()}
  else if(e.key==='Escape')closeSheet();
  else if(['1','2','3','4'].includes(e.key))openTab(['ben','iliski','kariyer','para'][+e.key-1]);
});
showStart();
</script>
</body>
