<script type="module">
import * as THREE from 'three';
const TL = await (await fetch('timeline.json')).json();
const S = {}; TL.segs.forEach(s => S[s.id] = s); window.TOTAL = TL.total;
const ORDER = TL.segs.map(s => s.id);
let T = 0;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x) };

const lerp = (a, b, u) => a + (b - a) * u;
const P = (id, a = 0, b = 1) => { const s = S[id]; const u = (T - s.s) / (s.e - s.s); return clamp((u - a) / (b - a)) };
const At = (t0, d) => clamp((T - t0) / d);
const inSeg = id => T >= S[id].s && T < S[id].e;
const after = id => T >= S[id].s;
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646 };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const C = h => new THREE.Color(h);

// ---------- renderer ----------
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; scene.add(sun); scene.add(sun.target);

// ---------- dokular ----------
function tex(w, h, draw, rep = [1, 1]) {

}
const grassImg = (g, w, h) => { g.fillStyle = '#69b744'; g.fillRect(0, 0, w, h); for (let i = 0; i < 2600; i++) { g.fillStyle = rnd() < .5 ? 'rgba(40,110,30,.35)' : 'rgba(150,215,90,.35)'; g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 3, 5 + rnd() * 8) } };

};
const soilImg = (g, w, h) => { g.fillStyle = '#7d5234'; g.fillRect(0, 0, w, h); for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(50,30,15,${.2 + rnd() * .3})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, 1 + rnd() * 4, 0, 7); g.fill() } };
const gravelImg = (g, w, h) => { g.fillStyle = '#9a9a96'; g.fillRect(0, 0, w, h); for (let i = 0; i < 1400; i++) { const v = 110 + rnd() * 110 | 0; g.fillStyle = `rgb(${v},${v},${v - 6})`; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 2 + rnd() * 5, 2 + rnd() * 4, rnd() * 3, 0, 7); g.fill() } };

const wallTileImg = (g, w, h) => { tileImg(g, w, h); g.fillStyle = '#123a73'; g.fillRect(0, 0, w, h * .14); g.fillStyle = 'rgba(255,255,255,.5)'; for (let i = 0; i < w; i += w / 16) g.fillRect(i, 0, 2, h * .14) };
const woodImg = (g, w, h) => { g.fillStyle = '#b07a48'; g.fillRect(0, 0, w, h); for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(90,50,20,${.15 + rnd() * .2})`; g.lineWidth = 1 + rnd() * 2; g.beginPath(); const y = rnd() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + rnd() * 6, w * .6, y - rnd() * 6, w, y); g.stroke() } };

const grassBase = tex(256, 256, grassImg); const bandBase = tex(256, 1024, bandImg);
const std = (o) => new THREE.MeshStandardMaterial(o);
const M = {
  soil: std({ map: tex(256, 256, soilImg, [2, 2]), roughness: 1 }), gravel: std({ map: tex(256, 256, gravelImg, [4, 2]), roughness: 1 }),
  conc: std({ color: 0xc6c6c0, roughness: .95 }), white: std({ color: 0xf4f4f0, roughness: .5 }), stone: std({ color: 0xe6dcc6, roughness: .8 }),
  rebar: std({ color: 0x8c4a28, roughness: .5, metalness: .4 }), yel: std({ color: 0xf2b705, roughness: .55 }), dark: std({ color: 0x2b2b2e, roughness: .85 }),
  glass: std({ color: 0x1d3446, roughness: .15, metalness: .3 }), wood: std({ map: tex(256, 128, woodImg), roughness: .8 }),
  trunk: std({ color: 0x7a5232, roughness: .9 }), cloud: std({ color: 0xffffff, roughness: 1, flatShading: true }), orange: std({ color: 0xff7a1a, roughness: .5 }),
  drum: std({ map: tex(256, 64, stripeImg), roughness: .5 }), blue: std({ color: 0x2f6fd6, roughness: .35, metalness: .1 }), grey: std({ color: 0x9aa0a8, roughness: .6, metalness: .2 }),
  asphalt: std({ map: tex(512, 128, asphaltImg, [24, 1]), roughness: .95 }), walk: std({ color: 0xc9c4ba, roughness: .9 }), fence: std({ color: 0xf3efe6, roughness: .8 }),
  patio: std({ color: 0xd8cfc0, roughness: .9 }),

const tileFloor = std({ map: tex(512, 512, tileImg, [6, 3]), roughness: .25 });
const tileBack = std({ map: tex(512, 512, wallTileImg, [6, 1]), roughness: .25 });
const tileSide = std({ map: tex(512, 512, wallTileImg, [3, 1]), roughness: .25 });

// ---------- yardımcılar ----------
const unit = new THREE.BoxGeometry(1, 1, 1);
function mk(mat, parent = scene, cast = true) { const m = new THREE.Mesh(unit, mat); m.castShadow = cast; m.receiveShadow = true; parent.add(m); return m }
function setB(m, x0, x1, y0, y1, z0, z1) { const ok = x1 - x0 > 1e-3 && y1 - y0 > 1e-3 && z1 - z0 > 1e-3; m.visible = ok; if (!ok) return; m.scale.set(x1 - x0, y1 - y0, z1 - z0); m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2) }

function bandMat(width, y0, y1) { const t = bandBase.clone(); t.needsUpdate = true; t.repeat.set(width / 3, (y1 - y0) / 12); t.offset.set(0, (y0 - GY0) / 12); return std({ map: t, roughness: 1 }) }

  const m = new THREE.Mesh(unit, [side, side, tm, M.soil, front, front]); m.receiveShadow = true; scene.add(m); setB(m, x0, x1, y0, y1, z0, z1); return m;
}

// ---------- zemin: düz mahalle, önden kesit ----------
ground(-90, -3.25, -150, 0); ground(3.25, 90, -150, 0); ground(-3.25, 3.25, -150, -3.25); ground(-3.25, 3.25, -3.25, 0, GY0, -2.0, 'soil');
const fillFront = bandMat(6.5, -2, 0), fillTopGrass = grassMat(6.5, 3.25);
const fill = new THREE.Mesh(unit, [M.soil, M.soil, fillTopGrass, M.soil, fillFront, M.soil]); fill.receiveShadow = true; scene.add(fill);

// ---------- mahalle ----------
function house(x, z, w, d, h, wall, roofC, door = true) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  part(g, std({ color: wall, roughness: .9 }), w, h, d, 0, h / 2, 0);
  const roof = new THREE.Mesh(new THREE.CylinderGeometry(.01, 1, 1, 4, 1), std({ color: roofC, roughness: .8 })); roof.rotation.y = Math.PI / 4;
  roof.scale.set(w / 1.414 * 1.15, h * .5, d / 1.414 * 1.15); roof.position.set(0, h + h * .25, 0); roof.castShadow = true; g.add(roof);
  const n = Math.max(2, Math.floor(w / 1.8));
  for (let i = 0; i < n; i++) { const wx = -w / 2 + (i + .5) * w / n; if (door && i === Math.floor(n / 2)) part(g, M.trunk, .9, 1.8, .06, wx, .9, d / 2 + .02); else part(g, M.glass, .8, .8, .06, wx, h * .55, d / 2 + .02) }
  if (h > 4) for (let i = 0; i < n; i++) part(g, M.glass, .8, .8, .06, -w / 2 + (i + .5) * w / n, h * .82, d / 2 + .02);
  return g;
}
function tree(x, z, s) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.14, .2, 1.4, 7), M.trunk); tr.position.y = .7; tr.castShadow = true; g.add(tr);
  for (let i = 0; i < 3; i++) { const l = new THREE.Mesh(new THREE.IcosahedronGeometry(.85 - i * .12, 0), leafMats[(i + Math.floor(x)) & 3]); l.position.set((rnd() - .5) * .5, 1.6 + i * .55, (rnd() - .5) * .5); l.castShadow = true; g.add(l) }
}

  for (const y of [.35, .75]) { const r = mk(M.fence); r.scale.set(Math.abs(x1 - x0) + .08 || .06, .07, Math.abs(z1 - z0) + .08 || .06); r.position.set((x0 + x1) / 2, y, (z0 + z1) / 2) }
}
house(-1.5, -16, 9, 6, 3.6, 0xf6efe4, 0xc8553d);
const patio = mk(M.patio); setB(patio, -6, 3, 0, .06, -12.6, -10);
fenceLine(-10, -1, -10, -21); fenceLine(10, -1, 10, -21); fenceLine(-10, -21, 10, -21);
const WALLS = [0xf3e3c3, 0xdfe8f0, 0xf1d6d0, 0xe2ecd9, 0xf5f0e6, 0xe8dcc8], ROOFS = [0xc8553d, 0x6d4c41, 0x3e5c76, 0xa0522d, 0x8b3a3a];
for (const [x, z] of [[-21, -14], [21, -13], [-36, -15], [36, -14]]) { house(x, z, 8, 6, rnd() < .5 ? 3.4 : 5.4, WALLS[(rnd() * 6) | 0], ROOFS[(rnd() * 5) | 0]); tree(x + (rnd() < .5 ? -5 : 5), z + 6, 1 + rnd() * .4) }
fenceLine(-31, -1, -31, -21); fenceLine(31, -1, 31, -21); fenceLine(-31, -21, 31, -21);
const road = mk(M.asphalt, scene, false); setB(road, -150, 150, 0, .03, -30, -24);
const walk1 = mk(M.walk, scene, false); setB(walk1, -150, 150, 0, .06, -24, -22); const walk2 = mk(M.walk, scene, false); setB(walk2, -150, 150, 0, .06, -32, -30);
for (let x = -60; x <= 60; x += 13) { house(x + rnd() * 3, -38.5, 8, 6, rnd() < .5 ? 3.4 : 5.4, WALLS[(rnd() * 6) | 0], ROOFS[(rnd() * 5) | 0]); tree(x + 6.5, -33.5, 1.1 + rnd() * .5) }
for (let x = -70; x <= 70; x += 14) house(x + rnd() * 4, -54, 9, 7, 3.4 + rnd() * 4, WALLS[(rnd() * 6) | 0], ROOFS[(rnd() * 5) | 0]);
for (let x = -84; x <= 84; x += 12) tree(x + rnd() * 4, -66 - rnd() * 8, 1.6 + rnd());
for (let x = -45; x <= 45; x += 9) { if (Math.abs(x) > 12) tree(x, -22.8, 1 + rnd() * .5); part(scene, M.dark, .1, 3, .1, x + 4.5, 1.5, -23.2) }
tree(-7.8, -4, 1.3); tree(8.3, -8.5, 1.5); tree(-8.4, -18.5, 1.2); tree(7.5, -19.5, 1.1);
const cars = [];
for (let i = 0; i < 4; i++) { const g = new THREE.Group(); scene.add(g); const col = [0xd63b3b, 0x3b7bd6, 0xf2f2f2, 0x2f2f33][i];
  part(g, std({ color: col, roughness: .4, metalness: .2 }), 3.6, .7, 1.7, 0, .55, 0); part(g, std({ color: col, roughness: .4 }), 2, .6, 1.5, -.2, 1.15, 0); part(g, M.glass, 2.02, .45, 1.52, -.2, 1.15, 0);
  for (const x of [-1.2, 1.2]) for (const z of [-.85, .85]) { const w = cyl(g, M.dark, .35, .25, x, .35, z, 12); w.rotation.x = Math.PI / 2 }
  g.userData = { x0: -80 + i * 47, v: i % 2 ? -5.5 : 6.5, z: i % 2 ? -25.5 : -28.5 }; if (i % 2) g.rotation.y = Math.PI; cars.push(g) }
const clouds = [];
for (let i = 0; i < 7; i++) { const g = new THREE.Group(); for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6 + rnd(), 1), M.cloud); b.position.set(k * 2 - 3, rnd() * .6, rnd()); g.add(b) }
  g.userData = { x: -90 + i * 28, y: 22 + rnd() * 6, z: -70 - rnd() * 30, v: .6 + rnd() * .4 }; scene.add(g); clouds.push(g) }

// ---------- kepçe ----------
const exc = new THREE.Group(); scene.add(exc);
part(exc, M.dark, 2.7, .55, 1.9, 0, .28, 0); part(exc, M.yel, 2.0, .85, 1.55, -.25, .98, 0); part(exc, M.yel, .95, .95, .95, .35, 1.85, -.28); part(exc, M.glass, .06, .55, .75, .84, 1.95, -.28);

const stick = new THREE.Group(); stick.position.set(2.7, 0, 0); boom.add(stick); part(stick, M.yel, .3, 2.0, .3, 0, -1.0, 0);

// ---------- çöken kenarlar ----------
const CH = [[-2.6, -1.0, 1.1, .8, .9], [-1.3, -2.75, 1.3, .8, .7], [.6, -2.8, 1.2, .9, .7], [2.6, -2.0, .9, .8, 1.1], [2.0, -.7, .8, .7, .9], [-.4, -2.9, .9, .7, .6]];
const chunks = CH.map(() => mk(M.soil));

// ---------- çakıl, demir, beton ----------
const gravel = mk(M.gravel);
const rebarSegs = [];

{ const m = new THREE.Matrix4(), q = new THREE.Quaternion(); rebarSegs.forEach(([a, b], i) => { const A = V(...a), B = V(...b), d = B.clone().sub(A); q.setFromUnitVectors(V(0, 1, 0), d.clone().normalize()); m.compose(A.clone().add(B).multiplyScalar(.5), q, V(1, d.length(), 1)); rebar.setMatrixAt(i, m) }) }
const cFloor = mk(M.conc), cBack = mk(M.conc), cLeft = mk(M.conc), cRight = mk(M.conc);
const truck = new THREE.Group(); scene.add(truck);

for (const x of [-1.9, .6, 1.8]) for (const z of [-1, 1]) { const w = cyl(truck, M.dark, .45, .35, x, .45, z * .95, 14); w.rotation.x = Math.PI / 2 }
const drum = new THREE.Mesh(new THREE.CylinderGeometry(.85, 1.05, 3.0, 20), M.drum); drum.rotation.z = Math.PI / 2 - .25; drum.position.set(1.0, 2.0, 0); drum.castShadow = true; truck.add(drum);
truck.rotation.y = Math.PI;

// ---------- seramik, merdiven, taş, deck ----------
const plane = new THREE.PlaneGeometry(1, 1);
const tFloor = new THREE.Mesh(plane, tileFloor); tFloor.rotation.x = -Math.PI / 2; tFloor.receiveShadow = true; scene.add(tFloor);
